<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <!--/seo-->
    <meta name="theme-color" content="#062149" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" /></noscript>

    <link rel="preload" as="image" href="/brand/logo-256.webp" type="image/webp" />
    <style>
      /* Splash screen: shown only while the app first loads; removed by src/utils/splash.js */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 38%, #ffffff 0%, #f4f7fb 55%, #e7eef7 100%);
        transition: opacity .45s ease, visibility .45s ease;
      }
      #splash.splash--hide { opacity: 0; visibility: hidden; }
      .splash-inner { display: grid; justify-items: center; gap: 14px; padding: 24px; animation: splash-in .7s cubic-bezier(.2, .7, .2, 1) both; }
      .splash-logo { width: clamp(96px, 22vw, 132px); height: auto; aspect-ratio: 1; }
      .splash-name { margin: 0; color: #062149; font: 700 clamp(24px, 6vw, 32px)/1 Georgia, serif; letter-spacing: -.5px; }
      .splash-name span { color: #d4af37; }
      .splash-tagline { margin: 0; color: #526b87; font: 700 11px/1.4 'Segoe UI', sans-serif; letter-spacing: .14em; text-transform: uppercase; text-align: center; }
      .splash-bar { width: 120px; height: 3px; margin-top: 6px; overflow: hidden; border-radius: 99px; background: #dce5ef; }
      .splash-bar span { display: block; width: 40%; height: 100%; border-radius: inherit; background: #d4af37; animation: splash-bar 1.1s ease-in-out infinite; }
      @keyframes splash-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
      @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
        .splash-inner, .splash-bar span { animation: none; }
      }
    </style>
    <noscript><style>#splash { display: none; }</style></noscript>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <img class="splash-logo" src="/brand/logo-256.webp" width="132" height="132" alt="" decoding="async" fetchpriority="high" />
        <p class="splash-name">VVS <span>FINCORP</span></p>
        <p class="splash-tagline">Fast Funding. Trusted Partnership.</p>
        <div class="splash-bar"><span></span></div>
      </div>
    </div>
    <script>
      // The app calls __hideSplash once the first page has rendered. The splash stays up for at
      // least SPLASH_MIN_MS so the logo animation is seen; the page renders underneath meanwhile.
      var SPLASH_MIN_MS = 1400
      var splashStart = Date.now()
      window.__hideSplash = function () {
        var splash = document.getElementById('splash')
        if (!splash || splash.dataset.hiding) return
        splash.dataset.hiding = '1'
        setTimeout(function () {
          splash.classList.add('splash--hide')
          setTimeout(function () { splash.remove() }, 500)
        }, Math.max(0, SPLASH_MIN_MS - (Date.now() - splashStart)))
      }
      // Failsafe: never keep visitors on the splash screen, even if the app fails to start.
      setTimeout(window.__hideSplash, 8000)
    </script>
    <div id="root"></div>
    <noscript>
      <div style="max-width:640px;margin:40px auto;padding:0 16px;font-family:'Segoe UI',sans-serif;color:#0a2e5d;line-height:1.6">
        <h1>VVS Fincorp: business funding in Chennai</h1>
        <p>Cheque-based finance, short-term business funding and direct funding solutions from ₹1 lakh to ₹30 crore.</p>
        <p>Please enable JavaScript to use this website, or contact us directly:<br />
          Phone: <a href="tel:+919363992147">+91 9363992147</a><br />
          Email: <a href="mailto:vvsfincorp@gmail.com">vvsfincorp@gmail.com</a><br />
          Address: 115/498, 59th Street, A-Type, SIDCO Nagar, Villivakkam, Chennai - 600049</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
